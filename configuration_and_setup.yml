# Database Schema - schema.sql

-- Users
CREATE TABLE users (
    id BIGSERIAL PRIMARY KEY,
    email VARCHAR(255) NOT NULL UNIQUE,
    password_hash VARCHAR(255) NOT NULL,
    full_name VARCHAR(255),
    subscription_tier VARCHAR(50) DEFAULT 'STARTER',
    api_quota_remaining INT DEFAULT 1000,
    is_active BOOLEAN DEFAULT true,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    preferences JSONB,
    INDEX idx_email (email)
);

-- Social Accounts
CREATE TABLE social_accounts (
    id BIGSERIAL PRIMARY KEY,
    user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    platform VARCHAR(50) NOT NULL,
    platform_user_id VARCHAR(255),
    access_token VARCHAR(500),
    refresh_token VARCHAR(500),
    expires_at TIMESTAMP,
    followers_count BIGINT DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    metadata JSONB,
    UNIQUE(user_id, platform),
    INDEX idx_user_platform (user_id, platform)
);

-- Content Posts
CREATE TABLE content_posts (
    id BIGSERIAL PRIMARY KEY,
    user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    content_text TEXT,
    media_urls TEXT[] DEFAULT ARRAY[]::TEXT[],
    status VARCHAR(50) DEFAULT 'DRAFT',
    tone VARCHAR(50),
    language VARCHAR(10) DEFAULT 'en',
    scheduled_time TIMESTAMP,
    published_time TIMESTAMP,
    platform_post_ids JSONB,
    approval_status VARCHAR(50) DEFAULT 'PENDING',
    approver_id BIGINT REFERENCES users(id),
    approval_time TIMESTAMP,
    approval_feedback TEXT,
    sentiment_score DECIMAL(3,2),
    brand_voice_score DECIMAL(3,2),
    performance_metrics JSONB,
    tags TEXT[],
    revision_history JSONB,
    content_fingerprint VARCHAR(64),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    INDEX idx_user_status (user_id, status),
    INDEX idx_scheduled_time (scheduled_time),
    INDEX idx_approval_status (approval_status)
);

-- Scheduled Jobs
CREATE TABLE scheduled_jobs (
    id BIGSERIAL PRIMARY KEY,
    post_id BIGINT NOT NULL REFERENCES content_posts(id) ON DELETE CASCADE,
    platform VARCHAR(50) NOT NULL,
    scheduled_time TIMESTAMP NOT NULL,
    executed_time TIMESTAMP,
    status VARCHAR(50) DEFAULT 'PENDING',
    retry_count INT DEFAULT 0,
    last_retry_time TIMESTAMP,
    next_retry_time TIMESTAMP,
    error_log TEXT,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    INDEX idx_status_time (status, scheduled_time),
    INDEX idx_platform (platform)
);

-- Comments & Engagement
CREATE TABLE comments_engagement (
    id BIGSERIAL PRIMARY KEY,
    platform_comment_id VARCHAR(255),
    platform_user_id VARCHAR(255),
    user_handle VARCHAR(255),
    post_id BIGINT REFERENCES content_posts(id),
    comment_text TEXT,
    timestamp TIMESTAMP,
    sentiment_score DECIMAL(3,2),
    emotion VARCHAR(50),
    intent VARCHAR(50),
    language VARCHAR(10),
    is_spam BOOLEAN DEFAULT false,
    flagged BOOLEAN DEFAULT false,
    platform VARCHAR(50),
    status VARCHAR(50) DEFAULT 'PENDING',
    assigned_user_id BIGINT REFERENCES users(id),
    response_text TEXT,
    response_time TIMESTAMP,
    auto_reply_id VARCHAR(255),
    conversation_context JSONB,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    INDEX idx_post_status (post_id, status),
    INDEX idx_platform_user (platform_user_id, platform)
);

-- Analytics Metrics
CREATE TABLE analytics_metrics (
    id BIGSERIAL PRIMARY KEY,
    post_id BIGINT REFERENCES content_posts(id),
    account_id BIGINT REFERENCES social_accounts(id),
    platform VARCHAR(50),
    metric_type VARCHAR(100),
    timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    value DECIMAL(15,2),
    breakdown_by_segment JSONB,
    platform_specific_data JSONB,
    INDEX idx_post_metric (post_id, metric_type),
    INDEX idx_timestamp (timestamp)
);

-- Approval Workflows
CREATE TABLE approval_workflows (
    id BIGSERIAL PRIMARY KEY,
    post_id BIGINT NOT NULL UNIQUE REFERENCES content_posts(id) ON DELETE CASCADE,
    status VARCHAR(50) DEFAULT 'PENDING',
    created_by BIGINT REFERENCES users(id),
    assigned_to BIGINT REFERENCES users(id),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    due_date TIMESTAMP,
    completed_at TIMESTAMP,
    feedback_text TEXT,
    revisions_count INT DEFAULT 0,
    risk_score DECIMAL(3,2),
    audit_trail JSONB,
    INDEX idx_status (status),
    INDEX idx_assigned_to (assigned_to)
);

-- Brand Guidelines
CREATE TABLE brand_guidelines (
    id BIGSERIAL PRIMARY KEY,
    user_id BIGINT NOT NULL UNIQUE REFERENCES users(id) ON DELETE CASCADE,
    guideline_text TEXT,
    tone_samples TEXT[],
    vocabulary_preferences TEXT[],
    prohibited_terms TEXT[],
    visual_guidelines JSONB,
    compliance_rules JSONB,
    version INT DEFAULT 1,
    last_updated TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- Create Indexes for Performance
CREATE INDEX idx_content_user_created ON content_posts(user_id, created_at DESC);
CREATE INDEX idx_comments_user_status ON comments_engagement(user_handle, status);
CREATE INDEX idx_metrics_account_date ON analytics_metrics(account_id, timestamp DESC);
CREATE INDEX idx_jobs_retry ON scheduled_jobs(next_retry_time) WHERE status = 'RETRY';

-- Time-series Partitioning for Analytics (for large deployments)
CREATE TABLE analytics_metrics_monthly PARTITION OF analytics_metrics
    FOR VALUES FROM ('2024-01-01') TO ('2024-02-01');

